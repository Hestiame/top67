<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ops — quizHub</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#6C2BD9,#FF3D81);text-align:center}
  .card{background:#fff;border-radius:22px;padding:38px 28px;width:100%;max-width:420px;
    box-shadow:0 20px 50px rgba(0,0,0,.28)}
  .em{font-size:56px;margin-bottom:8px}
  h1{font-family:'Fredoka',sans-serif;font-size:26px;font-weight:600;color:#2A1E47;margin-bottom:10px}
  p{color:#7C6F93;font-weight:700;font-size:15px;line-height:1.5}
  .btns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  a{flex:1;min-width:130px;padding:13px;border-radius:14px;text-decoration:none;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;transition:.15s}
  .p{background:linear-gradient(135deg,#6C2BD9,#FF3D81);color:#fff}
  .s{background:#F4F1FA;color:#6C2BD9}
  a:hover{filter:brightness(1.06)}
  .dica{margin-top:18px;font-size:13px;color:#9C93AE;font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <div class="em">🤔</div>
    <h1>Não achamos essa página</h1>
    <p>O endereço pode estar errado, ou a página que você procura não existe mais.</p>
    <div class="btns">
      <a class="p" href="/">Entrar num jogo</a>
      <a class="s" href="/host.html">Sou apresentador</a>
    </div>
    <p class="dica">Se você entrou por um QR code antigo, peça o PIN novo ao apresentador.</p>
  </div>
</body>
</html>
